name: Doc number collision guard

# WHY THIS EXISTS
#
# A doc-number collision guard already existed in two places, and neither one
# could actually stop a collision from landing:
#
#   1. .husky/pre-commit -> only runs on a local commit, on a clone that ran
#      `npm install`. The VPS loops and codex agents commit from clones that
#      often have no hooks installed, and `--no-verify` bypasses it anyway.
#   2. docs-automerge.yml -> computes `collision` but only uses it as an
#      AUTOMERGE CONDITION. On a collision it simply declines to auto-merge.
#      It never fails the PR, so a human merges it and the collision lands.
#
# Result: the collision count went from ~30 (when COLLISION_TOLERANCE.md was
# written, 2026-05-18) to 169 (2026-07-20).
#
# This workflow FAILS the PR instead. It is server-side, so it applies to every
# author - human, loop, or agent - and cannot be bypassed with --no-verify.
#
# It only ever fails on NEWLY INTRODUCED collisions. The historical collisions
# on main are deliberately grandfathered per research/COLLISION_TOLERANCE.md
# (renaming them would break the cross-reference link graph), so this guard
# compares added directories against main rather than auditing main itself.

# WHY THERE IS NO `paths:` FILTER
#
# There was one, scoped to research/**, and it made this check impossible to
# REQUIRE. A required check that does not report leaves a PR blocked forever
# rather than failing it, so a path-filtered check can never be mandatory - it
# simply does not run on a code-only PR.
#
# That was not theoretical. On 2026-08-15 PR #3101 carried `collision: fail`
# for a genuine duplicate (doc 2249) and `automerge` still read green, because
# collision was not among the required checks and could not be made one.
#
# The job is already cheap and safe to run on every PR: if the diff adds no new
# research doc directories it prints "Nothing to check" and exits 0. Removing
# the filter costs one checkout per PR and buys a check that can actually be
# binding.

on:
  pull_request:

jobs:
  collision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on a newly introduced doc-number collision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --quiet

          # Only ADDED doc dirs can introduce a NEW collision. A modified doc
          # cannot, and filtering to additions keeps renames from false-firing.
          #
          # Run the git command as its OWN step and check IT failed, so a git
          # error aborts (fail closed) instead of yielding empty output that the
          # guard reads as "nothing to check" and passes vacuously
          # (silent-failure-guard rule 5). grep's expected no-match stays benign
          # via the inner `|| true` on the grep pipe only.
          added=$(git diff --name-only --diff-filter=A "$base"...HEAD) \
            || { echo "::error title=doc-guard git diff failed::cannot compute added files - failing closed"; exit 1; }
          newdirs=$(printf '%s\n' "$added" \
            | grep -oE '^research/[^_/][^/]*/[0-9]{3,4}-[^/]+/' \
            | sort -u || true)

          if [ -z "$newdirs" ]; then
            echo "No new research doc directories in this PR. Nothing to check."
            exit 0
          fi

          # Every doc DIRECTORY that already exists on the base branch. Compare
          # directories, not bare numbers, so a doc can never collide with
          # ITSELF: `$base` is re-fetched at job start and points at LIVE main,
          # and auto-merge routinely lands a docs PR while this job is still
          # running (PRs #2840/#2843/#2844 all merged 9-15s after their guard job
          # started). The number-only comparison then found the PR's own,
          # just-merged directory on main and failed the PR against itself - so
          # the guard red-flagged every clean docs PR and a REAL collision became
          # indistinguishable from the routine false alarm. Excluding the exact
          # same path keeps a genuine same-number/different-slug collision failing,
          # including one that landed on main after this branch was cut.
          basetree=$(git ls-tree -r --name-only "$base") \
            || { echo "::error title=doc-guard git ls-tree failed::cannot read base tree - failing closed"; exit 1; }
          existingdirs=$(printf '%s\n' "$basetree" \
            | grep -oE '^research/[^_/][^/]*/[0-9]{3,4}-[^/]+/' \
            | sort -u || true)

          # ALSO compare against every OTHER OPEN PR's added doc dirs.
          #
          # On 2026-08-15 doc 2282 landed TWICE - research/business/2282-reddit-
          # as-oss-outreach-channel and research/infrastructure/2282-fleet-output-
          # audit. Both PRs passed this guard, correctly by its own logic: neither
          # doc was on main when the other was checked, and both merged after.
          # Comparing only against the base branch cannot see a sibling in flight.
          #
          # HONEST LIMIT: this narrows the window, it does not close it. Two
          # guards running at the same moment can still both miss, because each
          # sees the other's PR before its files are final. Closing it properly
          # means requiring branches to be up to date before merging, which is
          # deliberately off (it would put every PR on a rebase treadmill).
          otherdirs=""
          if [ -n "${GH_TOKEN:-}" ]; then
            others=$(gh api "repos/${{ github.repository }}/pulls?state=open&per_page=100" \
              --jq ".[] | select(.number != ${{ github.event.pull_request.number }}) | .number" 2>/dev/null | head -40) || others=""
            if [ -z "$others" ]; then
              echo "::warning title=doc-guard::could not list open PRs - checking against ${{ github.base_ref }} only, so a sibling PR with the same number would not be caught"
            fi
            for n in $others; do
              files=$(gh api "repos/${{ github.repository }}/pulls/$n/files?per_page=100" \
                --jq '.[] | select(.status=="added") | .filename' 2>/dev/null) || continue
              d=$(printf '%s\n' "$files" | grep -oE '^research/[^_/][^/]*/[0-9]{3,4}-[^/]+/' | sort -u || true)
              [ -n "$d" ] && otherdirs=$(printf '%s\n%s' "$otherdirs" "$d#$n")
            done
          else
            echo "::warning title=doc-guard::no GH_TOKEN - checking against ${{ github.base_ref }} only"
          fi

          fail=0
          while read -r d; do
            [ -z "$d" ] && continue
            num=$(echo "$d" | sed -E 's|^research/[^/]+/([0-9]{3,4})-.*|\1|')
            hits=$(printf '%s\n' "$existingdirs" \
              | grep -E "^research/[^/]+/${num}-" \
              | grep -vxF "$d" || true)
            if [ -n "$hits" ]; then
              echo "::error title=Doc number $num already exists::$d collides with an existing doc number on ${{ github.base_ref }}."
              echo "  existing doc(s) with number $num:"
              printf '%s\n' "$hits" | sed 's/^/    /'
              fail=1
            fi

            # Same number, different open PR. Names the PR so the fix is obvious.
            inflight=$(printf '%s\n' "$otherdirs" \
              | grep -E "^research/[^/]+/${num}-" \
              | grep -v "^${d}#" || true)
            if [ -n "$inflight" ]; then
              echo "::error title=Doc number $num is claimed by an open PR::$d collides with a doc in flight."
              echo "  claimed by:"
              printf '%s\n' "$inflight" | sed 's/#/  <- PR #/' | sed 's/^/    /'
              fail=1
            fi
          done <<< "$newdirs"

          if [ "$fail" -eq 1 ]; then
            echo ""
            echo "Fix: renumber your new doc to the next free number, rename its"
            echo "directory, and update the row you added to research/<topic>/README.md."
            echo ""
            echo "Next free number:"
            git ls-tree -r --name-only "$base" \
              | grep -oE '^research/[^/]+/[0-9]{3,4}-' \
              | grep -oE '[0-9]{3,4}' | sort -n | tail -1 \
              | awk '{print "  " $1 + 1}'
            exit 1
          fi

          echo "No new doc-number collisions introduced."
