name: Auto-merge safe PRs

# Safe categories self-merge once CI is green:
#   docs    — research/** and docs/** only (with doc-number collision guard)
#   tests   — *.test.ts, *.test.tsx, *.spec.ts, *.spec.tsx, __tests__/**
#   scripts — NEWLY-ADDED standalone tools under scripts/**/*.py|*.sh (may ride
#             alongside docs). Safe because: (a) additive only — a *modified*
#             script drops the PR to unsafe, so nothing already-wired changes;
#             (b) standalone — scripts/** is not imported by the app or the bot
#             runtime, so merging one cannot break the build or boot; (c) it
#             cannot be auto-invoked by the merge — only .husky/** and
#             .github/** run automatically, both outside scripts/. Convention:
#             the author runs the script's --selftest before opening the PR.
# All other PRs (runtime code, config, CI changes) wait for Zaal.
# --auto requires all required status checks to pass before merging.
# No fallback merge without CI receipt — the || bypass is intentionally removed.
# Mix rule: any combination of docs + tests + additive scripts auto-merges (none is
# runtime); any runtime/config/CI file makes the whole PR unsafe (waits for Zaal).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # CHECKOUT IS WHAT MAKES THE COLLISION GATE CORRECT. This job had none, so
      # the gate could only ask the GitHub API "what files were added", and a
      # renumbering rename adds nothing - see the step below. With the repo on
      # disk it calls the same shared rule the other two guards use.
      # fetch-depth: 0 because that rule needs base...HEAD, not a shallow tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PIN TO THE PR HEAD. With no `ref:`, checkout takes refs/pull/N/merge
          # on a pull_request event, and GitHub regenerates that ref against
          # whatever main is when the runner picks the job up. `base.sha` is main
          # at EVENT time, so `base.sha...HEAD` would span the merge commit and
          # attribute every doc that landed on main in between to this PR.
          # Measured by vault with one unrelated doc merging while the job was
          # queued: the merge ref claimed research/community/2999-someone-else/
          # alongside this PR's own directory; pinned to the head it claims only
          # its own.
          #
          # It fails closed, so it could never let a bad merge through - it could
          # only HOLD a good PR, naming a doc the author never touched. That
          # still matters here for two reasons: ZAOOS has 30+ pre-band duplicate
          # numbers, so a contaminated directory whose number is duplicated on
          # main reports a collision; and a gate that merges with nobody present
          # has to give the SAME ANSWER TWICE, while the merge ref gives a
          # different answer depending on when the runner started.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Classify PR files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read "status<TAB>filename" pairs so we can require additive-only scripts.
          #
          # --paginate is load-bearing: without it this returns only the FIRST page
          # (100 files) and every file past that is invisible to the classifier. A
          # PR whose 101st file is runtime code would be classified off its first
          # 100 (docs) and auto-merged unreviewed. GitHub still hard-caps this
          # endpoint at 3000 files, so the count assertion below fails closed on
          # any remaining truncation (silent-failure-guard rules 1-3).
          pairs=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100" --jq '.[] | "\(.status)\t\(.filename)"')
          echo "$pairs"

          # Fail closed unless we saw EVERY changed file. A short list can only
          # under-report unsafe files, so anything incomplete waits for Zaal.
          seen=$(printf '%s\n' "$pairs" | grep -c . || true)
          expected='${{ github.event.pull_request.changed_files }}'
          if [ "$seen" != "$expected" ]; then
            echo "::warning title=PR file list incomplete::classified $seen of $expected changed files - holding for review"
            echo "category=unsafe" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          has_docs=0; has_tests=0; has_scripts=0; has_unsafe=0
          while IFS=$'\t' read -r status f; do
            [ -z "$f" ] && continue
            case "$f" in
              research/*|docs/*)
                has_docs=1
                ;;
              *.test.ts|*.test.tsx|*.spec.ts|*.spec.tsx|*/__tests__/*)
                has_tests=1
                ;;
              scripts/*.py|scripts/*.sh)
                # additive standalone tools only — a modified script may be wired
                # into something, so it is NOT auto-safe.
                if [ "$status" = "added" ]; then has_scripts=1; else has_unsafe=1; fi
                ;;
              *)
                has_unsafe=1
                ;;
            esac
          done <<< "$pairs"

          # Combination rules: any file touching runtime/config/CI -> unsafe (waits
          # for Zaal). Otherwise ANY mix of the three individually-safe categories
          # (docs, tests, additive scripts) auto-merges - none of them contains
          # runtime code, so a mix cannot break the build or bot. If docs are present
          # the category is "docs" so the doc-number collision guard runs.
          # (Relaxed 2026-07-17: docs+tests was previously forced unsafe, which piled
          #  up green PRs that bundle a research-doc edit with test files - a big chunk
          #  of the merge backlog. Mixing individually-safe categories is still safe.)
          if [ "$has_unsafe" = "1" ]; then
            category="unsafe"
          elif [ "$has_docs" = "1" ]; then
            category="docs"        # docs, optionally + tests + additive scripts; collision guard runs
          elif [ "$has_tests" = "1" ]; then
            category="tests"       # tests, optionally + additive scripts; no docs
          elif [ "$has_scripts" = "1" ]; then
            category="scripts"
          else
            category="unsafe"
          fi
          echo "category=${category}" >> "$GITHUB_OUTPUT"

      - name: Block doc-number collisions
        if: steps.classify.outputs.category == 'docs'
        id: collide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A doc number must be globally unique across research/. If this PR
          # ADDS research/<topic>/NNN-slug/ and main already has NNN under a
          # different slug anywhere, hold the PR for a human instead of merging
          # a collision (this happened: #1073 duplicated 964).
          #
          # Only ADDED doc dirs can introduce a NEW collision. Filtering to
          # status=added is load-bearing: a PR that merely EDITS an existing doc
          # whose number was historically collided (30+ such pre-band dups on main,
          # e.g. 363 exists as both community/363-... and agents/363-...) would
          # otherwise be falsely held forever - which blocked real green docs PRs
          # (#1650/#1654/#1661/#1613) on edits they did not author. (Fixed 2026-07-17.)
          # --paginate for the same reason as the classifier: an added doc dir past
          # the first page would otherwise never be collision-checked.
          # THIS STEP USED TO DECIDE WITH NOBODY PRESENT, AND IT WAS BLIND.
          # It selected `.status=="added"` from the API. A doc RENUMBERED onto a
          # taken number is a rename - it adds no directory - so `newdirs` came
          # back empty, the step wrote collision=false, and the PR proceeded
          # toward an AUTOMATIC merge. Every other instance of this filter holds
          # a PR for a human who can read the message; this one is the only
          # place the estate merges with no human in the loop, which is why it
          # is the one that matters (vault's sweep, 2026-09-12).
          #
          # The comment above about `status=="added"` being load-bearing was
          # RIGHT and is why the fix is not a wider filter: folding in M would
          # hold every ordinary edit to any of the 30+ pre-band duplicate
          # numbers, which is what broke #1650/#1654/#1661/#1613 in July. The
          # actual rule is "renames whose NUMBER changed", and it now lives in
          # exactly one place, called by all three guards.
          #
          # FAILS CLOSED. If the rule cannot answer, this holds the PR rather
          # than merging it. Empty output must mean "no claims" and never "I
          # could not look" - the same confusion that let a staged secret
          # through the scan gate in #3444.
          if ! newdirs=$(bash scripts/doc-new-claims.sh --range "${{ github.event.pull_request.base.sha }}"); then
            echo "::error::doc-new-claims.sh could not determine the claimed doc numbers - holding this PR rather than auto-merging it"
            echo "collision=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No re-filter here. doc-new-claims.sh already emits exactly
          # research/<topic>/<number>-<slug>/ and nothing else; re-checking its
          # output against a SECOND regex is how the two copies drifted in the
          # first place. This line used to read `^research/[a-z_-]+/[0-9]+-`,
          # whose `[a-z_-]+` INCLUDES the underscore, so it disagreed with the
          # seam about whether research/_radar/ and research/_archive/ are topic
          # dirs. Strip the trailing slash and use what the seam said.
          newdirs=$(printf '%s\n' "$newdirs" | sed 's:/*$::' | sort -u || true)
          if [ -z "$newdirs" ]; then echo "collision=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The EXISTING set must use the same definition of a doc as the seam,
          # or the comparison is between two different things. `[a-z_-]+`
          # included the underscore, so 102 entries under research/_archive/,
          # _handoffs/ and _radar/ were read as numbered docs - and a missing
          # directory requirement meant a date-named file like
          # research/inspiration/2026-04-01.md was read as doc 2026. Measured
          # 2026-09-12: three phantom numbers (117, 229, 2026) already collide
          # with real docs on main, so a PR claiming any of them would have been
          # held for a collision that does not exist.
          main_dirs=$(gh api "repos/${{ github.repository }}/git/trees/main?recursive=1" --paginate --jq '.tree[].path' \
            | grep -oE '^research/[^_/][^/]*/[0-9]+-[^/]+/' | sed 's:/*$::' | sort -u)
          collision=false
          while IFS= read -r d; do
            num=$(basename "$d" | grep -oE '^[0-9]+')
            slug=$(basename "$d")
            hits=$(echo "$main_dirs" | grep -E "/${num}-" | grep -v "/${slug}$" || true)
            if [ -n "$hits" ]; then
              collision=true
              gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                -f body="Auto-merge held: doc number ${num} already exists on main under a different slug: ${hits}. Renumber before merging." >/dev/null
            fi
          done <<< "$newdirs"
          echo "collision=$collision" >> "$GITHUB_OUTPUT"

      # KNOWN GAP - this merge produces a main commit that CI never runs on.
      #
      # GitHub does not start a workflow run for a push made with the automatic
      # GITHUB_TOKEN (anti-recursion). `github.token` below IS that token, so the
      # squash-merge this step performs lands on main silently: ci.yml's
      # `push: [main]` trigger never fires. Measured 2026-08-12 - four consecutive
      # bot-merged commits (#3059, #3062, #3064, #3066) with zero runs between them,
      # while the user-merged #3057 immediately before got its run normally.
      #
      # The gate itself is still real: --auto holds the merge until the PR's
      # required checks pass. What is missing is verification of the MERGE RESULT,
      # which is a different tree from the branch head that was checked.
      #
      # THE FIX needs a token whose pushes do trigger workflows - a fine-grained
      # PAT or a GitHub App installation token in a repo secret, swapped in for
      # `github.token` on this step only. That is a Zaal action because it means
      # creating and storing a credential. Until then, ci.yml carries a daily
      # schedule + workflow_dispatch so main's real state stays observable.
      - name: Enable auto-merge (squash)
        if: |
          (steps.classify.outputs.category == 'docs' && steps.collide.outputs.collision != 'true') ||
          steps.classify.outputs.category == 'tests' ||
          steps.classify.outputs.category == 'scripts'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo "${{ github.repository }}" --squash --auto
