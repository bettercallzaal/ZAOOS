name: Estate Health

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1' # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # PR guardrail: token-free checks, sticky comment, ratchet (fail only on NEW debt).
  guardrail:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run estate checks
        id: checks
        run: |
          MAX=$(jq -r '.baseline.ratchetMaxFails' tools/estate-control-plane/config.json)
          echo "max_fails=$MAX" >> "$GITHUB_OUTPUT"
          set +e
          npx -y tsx tools/estate-control-plane/run-checks.ts \
            --ci --max-fails="$MAX" \
            --pr-comment=/tmp/estate-pr.md --baseline-fails="$MAX" \
            --out=/tmp/estate-report.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      # A pull request from a fork gets a read-only GITHUB_TOKEN whatever the
      # permissions block above asks for, so the comment calls answer 403
      # "Resource not accessible by integration". That used to fail this step,
      # which failed the job AND skipped Enforce ratchet below, so a fork PR
      # was red for the comment and never for its debt. On a fork PR a 403
      # from the comment calls is now a warning and the report goes to the job
      # summary instead. Every other error, and any error on a same-repo PR,
      # still fails the step. The ratchet itself is the next step and is
      # unchanged: it fails closed on new debt, fork or not.
      - name: Upsert sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/estate-pr.md', 'utf8');
            const marker = '<!-- estate-control-plane -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const pr = context.payload.pull_request;
            const headRepo = pr && pr.head && pr.head.repo ? pr.head.repo.full_name : null;
            const isFork = headRepo !== `${owner}/${repo}`;
            try {
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
              const existing = comments.find((c) => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (err) {
              if (!(isFork && err && err.status === 403)) throw err;
              core.warning(`Estate comment not posted: this PR is from a fork (${headRepo || 'head repo gone'}) and its token cannot write comments (${err.message}). The report is in the job summary. The ratchet step still runs.`);
              await core.summary.addRaw(body, true).write();
            }

      - name: Enforce ratchet
        if: steps.checks.outputs.exit != '0'
        run: |
          echo "Estate health ratchet breached - new debt added above baseline ${{ steps.checks.outputs.max_fails }}."
          exit 1

  # Weekly sweep: regenerate dashboard + digest, upload as artifacts.
  # Next steps (need secrets, wire when ready): deploy dashboard to Vercel,
  # open/update an 'Estate Health' issue, push the digest to ZOE/Telegram,
  # open an auto count-fix PR for fixable drift.
  sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run + render
        run: |
          npx -y tsx tools/estate-control-plane/run-checks.ts \
            --out=/tmp/estate-report.json \
            --dashboard=/tmp/estate-dashboard.html \
            --digest=/tmp/estate-digest.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: estate-health
          path: |
            /tmp/estate-report.json
            /tmp/estate-dashboard.html
            /tmp/estate-digest.txt
          retention-days: 30
