name: Clear licence hold

# WHY THIS EXISTS
#
# docs-automerge.yml holds any research doc that adds licence or reuse-permission
# lines. Measured over the last 21 docs-only PRs that is 8 holds (38%), all real
# licence conclusions, because credit-attribution.md requires docs to name the
# licence of what we build on. Zaal, 2026-09-13, asked that this NOT come back to
# him: "Let's improve the barrier that the agents can ship thru".
#
# So the hold is cleared by an INDEPENDENT REVIEWER LANE: one that did not write
# or propose the doc checks every licence and permission claim against its source
# and comments `licence-verified: <full head SHA>`. This workflow merges exactly
# that SHA. Zaal is needed only when the reviewer refuses.
#
# WHAT IT TRUSTS, AND WHAT IT DOES NOT
#
# - It does NOT trust the comment author. Every lane comments as Zaal's account,
#   so author identity proves nothing about which lane wrote it. Author != reviewer
#   stays a lane rule, the same honor-system rule the rest of review runs on.
# - It DOES trust a `licence-hold-head: <sha>` marker posted by
#   github-actions[bot], which no lane can post as. docs-automerge.yml writes it
#   only for a head it judged docs-only with no doc-number collision. The
#   clearance SHA must equal that marker AND the PR's current head, so a
#   clearance can never merge a later push or a head that was never judged.
# - It re-lists the files and refuses anything outside research/ and docs/, in
#   case a runtime file arrived between the judgement and the comment.
# - The merge is pinned with --match-head-commit, so a push racing the merge
#   is refused by GitHub, not by this script.
#
# Comment text reaches the script only through an env var, never through ${{ }}
# interpolation, because an issue_comment body is attacker-controlled input.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  clear:
    if: github.event.issue.pull_request && contains(github.event.comment.body, 'licence-verified:')
    runs-on: ubuntu-latest
    steps:
      - name: Verify clearance and merge the verified head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          set -euo pipefail
          say() { gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$1" >/dev/null; }

          sha=$(printf '%s\n' "$BODY" | grep -oE '^licence-verified: [0-9a-f]{40}\s*$' | head -1 | awk '{print $2}' || true)
          if [ -z "$sha" ]; then
            say "licence-clear: ignored $COMMENT_URL - it must be a line reading exactly \`licence-verified: <full 40-char head SHA>\`."
            exit 0
          fi

          pr=$(gh api "repos/$REPO/pulls/$PR")
          head=$(printf '%s' "$pr" | jq -r .head.sha)
          state=$(printf '%s' "$pr" | jq -r .state)
          same_repo=$(printf '%s' "$pr" | jq -r '.head.repo.full_name == .base.repo.full_name')
          expected=$(printf '%s' "$pr" | jq -r .changed_files)

          if [ "$state" != "open" ] || [ "$same_repo" != "true" ]; then
            say "licence-clear: not merging - PR is $state or from a fork."; exit 0
          fi
          if [ "$sha" != "$head" ]; then
            say "licence-clear: not merging - the clearance names $sha but the head is now $head. Verify the new head and clear that."; exit 0
          fi

          # The bot marker for THIS head. Author login is checked, not the text alone.
          if ! markers=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
                --jq '.[] | select(.user.login == "github-actions[bot]") | .body'); then
            say "licence-clear: not merging - could not read the PR comments to find the hold marker."; exit 0
          fi
          if ! printf '%s\n' "$markers" | grep -qE "^licence-hold-head: $head( |$)"; then
            say "licence-clear: not merging - docs-automerge has not judged head $head as a licence-only hold (no licence-hold-head marker for it). Only a docs-only PR with no doc-number collision can be cleared here."; exit 0
          fi

          # Re-list the files: fail closed on anything but research/ and docs/.
          if ! files=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename'); then
            say "licence-clear: not merging - could not list the PR files."; exit 0
          fi
          seen=$(printf '%s\n' "$files" | grep -c . || true)
          if [ "$seen" != "$expected" ]; then
            say "licence-clear: not merging - saw $seen of $expected changed files."; exit 0
          fi
          other=$(printf '%s\n' "$files" | grep -vE '^(research|docs)/' || true)
          if [ -n "$other" ]; then
            say "licence-clear: not merging - files outside research/ and docs/: $(printf '%s' "$other" | head -5 | tr '\n' ' ')"; exit 0
          fi

          gh pr merge "$PR" --repo "$REPO" --squash --auto --match-head-commit "$head"
          gh api -X DELETE "repos/$REPO/issues/$PR/labels/hold:licence" >/dev/null 2>&1 || true
          say "licence-clear: licence hold cleared by $COMMENT_URL for $head. Auto-merge enabled for that commit only; it still waits on required checks."
