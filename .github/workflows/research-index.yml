name: Research index (CI-owned)
# CI OWNS the research folder index so PRs never hand-edit the shared
# research/<topic>/README.md (which made concurrent doc PRs collide and stall).
#
# - On push to main: backfill any missing index rows and open a PR with them
#   (branch ci/research-index-backfill-<run_id>; the commit is tagged [skip ci]
#   so the backfill branch does not loop). main is protected, so the job never
#   pushes to main. The index self-heals one merge later; PRs do not touch it.
# - On a PR: advisory only. It reports unindexed docs as a warning but NEVER
#   blocks - the merge will backfill them. This replaces the old blocking
#   check-research-index guard that forced every PR to add its own row.
on:
  pull_request:
    paths:
      - 'research/**'
  push:
    branches:
      - main
    paths:
      - 'research/**'
      - 'scripts/backfill-research-index.sh'
      - '.github/workflows/research-index.yml'
permissions:
  contents: write
jobs:
  research-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Backfill missing folder-index rows
        run: bash scripts/backfill-research-index.sh

      - name: Open a PR with backfilled rows (main only, FATAL if it cannot)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ci/research-index-backfill-${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! git diff --quiet -- research; then
            git config user.name "zao-index-bot"
            git config user.email "zao-index-bot@users.noreply.github.com"
            # Run 38062695645 (after doc PR #3876 merged at da4f1d20) pushed this
            # commit to main and GitHub refused it twice: "GH006: Protected branch
            # update failed for refs/heads/main - Changes must be made through a
            # pull request." Branch protection is not a race, so the job no longer
            # pushes to main. It writes the rows to a branch and opens a PR, so the
            # index is one PR away, not behind disk.
            #
            # `git add research/*/README.md` died once: the glob expands to a path
            # behind a TRACKED SYMLINK (research/314-... -> music/314-...), and git
            # refuses a pathspec that traverses a symlink (exit 128). `-u` stages
            # modifications to already-tracked files under research/ (this script
            # only appends to existing topic READMEs). Keep it.
            #
            # Idempotence: a PR already open for this branch is printed and reused.
            existing=$(gh api "repos/$REPO/pulls?head=$OWNER:$BRANCH&state=open" --jq '.[0].html_url // empty') || { echo "::error::index backfill could not query open PRs for $BRANCH - the research index is NOT reporting success"; exit 1; }
            if [ -n "$existing" ]; then
              echo "backfill PR already open: $existing"
              exit 0
            fi
            git checkout -b "$BRANCH"
            git add -u -- research
            git commit -m "chore(research): CI backfill folder index rows [skip ci]"
            # FATAL on failure, never `|| true`. A rejected push means the index
            # fell behind disk with nobody told; that is a fail, not a warning.
            git push origin "HEAD:refs/heads/$BRANCH" || { echo "::error::index backfill could not push branch $BRANCH - the research index is now behind disk and this job is NOT reporting success"; exit 1; }
            body_file="$RUNNER_TEMP/research-index-backfill-body.md"
            {
              echo "Automated folder-index backfill from the research-index workflow (run ${GITHUB_RUN_ID})."
              echo
              echo "The job runs on push to main. It found research docs with no row in their"
              echo "topic folder README and wrote the rows here instead of pushing to main,"
              echo "because main is protected (GH006 on run 38062695645)."
              echo
              echo "Only index rows change. The commit is tagged [skip ci] so this branch does"
              echo "not trigger another backfill. Merge it to clear the index drift."
            } > "$body_file"
            pr_url=$(gh api -X POST "repos/$REPO/pulls" \
              -f title="chore(research): CI backfill folder index rows (run ${GITHUB_RUN_ID})" \
              -f head="$BRANCH" \
              -f base=main \
              -F body=@"$body_file" \
              --jq '.html_url') || { echo "::error::index backfill pushed $BRANCH but could not open a PR (check that Actions may create pull requests in repo settings) - the research index is now behind disk and this job is NOT reporting success"; exit 1; }
            echo "backfill PR opened: $pr_url"
          else
            echo "index already complete"
          fi

      - name: Advisory index report (PRs never block on this)
        if: github.event_name == 'pull_request'
        run: |
          # PRs no longer need to add their own index row - CI backfills on merge.
          # Surface anything unindexed as a non-blocking warning only.
          if bash scripts/check-research-index.sh --all; then
            echo "index complete"
          else
            echo "::warning::some docs not yet in their folder index - CI will backfill on merge (non-blocking)"
          fi
