name: Research index (CI-owned)
# CI OWNS the research folder index so PRs never hand-edit the shared
# research/<topic>/README.md (which made concurrent doc PRs collide and stall).
#
# - On push to main: backfill any missing index rows and commit them back
#   ([skip ci] so it does not loop). The index self-heals; PRs do not touch it.
# - On a PR: advisory only. It reports unindexed docs as a warning but NEVER
#   blocks - the merge will backfill them. This replaces the old blocking
#   check-research-index guard that forced every PR to add its own row.
on:
  pull_request:
    paths:
      - 'research/**'
  push:
    branches:
      - main
    paths:
      - 'research/**'
      - 'scripts/backfill-research-index.sh'
      - '.github/workflows/research-index.yml'
permissions:
  contents: write
jobs:
  research-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backfill missing folder-index rows
        run: bash scripts/backfill-research-index.sh

      - name: Commit backfilled rows (main only, FATAL if the push fails)
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- research; then
            git config user.name "zao-index-bot"
            git config user.email "zao-index-bot@users.noreply.github.com"
            # `git add research/*/README.md` died here: the shell glob expands
            # to research/314-music-metadata-isrc-ai-distribution/README.md,
            # which sits behind a TRACKED SYMLINK (research/314-... ->
            # music/314-...), and git refuses a pathspec that traverses a
            # symlink ("fatal: ... is beyond a symbolic link", exit 128). The
            # step is `bash -e`, so the job died and the backfill was thrown
            # away on every run that actually had rows to commit.
            # `-u` stages modifications to already-tracked files under
            # research/ (all this script ever does is append to an existing
            # topic README), and a directory pathspec never walks the symlink.
            git add -u -- research
            git commit -m "chore(research): CI backfill folder index rows [skip ci]"
            # FIXED (ZAO research doc 2478, inverted alarm #6): this used to
            # degrade a push failure to "::warning::" and still exit 0 - a
            # stopped backfill (branch protection changed, auth expired) and a
            # genuinely complete index rendered identically green in Actions.
            # A push failure here means the index just fell behind disk with
            # nobody told; that is a fail, not a warning.
            # A HARD FAIL MUST NOT FIRE ON THE NORMAL CASE. Losing a
            # fast-forward race with a concurrent merge is routine here and is
            # not a fault: measured on origin/main over 30 days, 266 commits
            # touched the paths that trigger this workflow and 26 consecutive
            # pairs landed within 120 seconds of each other, 54 within 300. The
            # job checks out, backfills, commits and pushes inside that window,
            # so about a tenth of triggering merges would red main for losing a
            # race. A check that fires on the ordinary case is ignored by the
            # time it fires on the real one, and this one fires on main
            # (`noisy-signal-guard.md`; zaoos-review, #3458 review).
            #
            # So: rebase onto whatever landed and try once more. Branch
            # protection and an expired token still fail, because a rebase does
            # not make either of them push. Only the race is absorbed.
            if ! git push; then
              echo "::notice::push rejected, rebasing onto origin/main and retrying once"
              git fetch origin main
              git rebase origin/main || { echo "::error::index backfill could not rebase onto origin/main - the research index is now behind disk and this job is NOT reporting success"; exit 1; }
              git push || { echo "::error::index backfill commit could not be pushed after a rebase (branch protection or auth failure, not a race) - the research index is now behind disk and this job is NOT reporting success"; exit 1; }
            fi
          else
            echo "index already complete"
          fi

      - name: Advisory index report (PRs never block on this)
        if: github.event_name == 'pull_request'
        run: |
          # PRs no longer need to add their own index row - CI backfills on merge.
          # Surface anything unindexed as a non-blocking warning only.
          if bash scripts/check-research-index.sh --all; then
            echo "index complete"
          else
            echo "::warning::some docs not yet in their folder index - CI will backfill on merge (non-blocking)"
          fi
