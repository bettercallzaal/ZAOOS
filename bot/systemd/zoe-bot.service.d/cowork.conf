# zoe-bot drop-in: ZOE's cowork board credentials, read from a private file.
#
# Install target on the VPS: ~/.config/systemd/user/zoe-bot.service.d/cowork.conf
# NOT installed by scripts/zoe-autodeploy.sh, which copies zoe-bot.service only.
# Installing it is a hand step: see README.md in this directory (card 9371).
#
# Replaces a drop-in whose line was Environment=COWORK_BOT_TOKEN=<value>, which
# kept the token in plaintext in the unit and printed it in `systemctl show`.
#
# The env file holds two lines, chmod 600, never committed:
#   COWORK_API_URL=...
#   COWORK_BOT_TOKEN=...
# Files given with EnvironmentFile= override Environment= (systemd.exec), and
# a drop-in is read after the main unit, so this file wins over bot/.env for
# any variable set in both. Keep COWORK_* out of bot/.env.
[Service]
EnvironmentFile=%h/.zao/private/zoe-cowork.env
