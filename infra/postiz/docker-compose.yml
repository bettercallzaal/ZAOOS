# Self-hosted Postiz for ZAO brands (doc 2667, phase 1). Runbook: README.md.
#
# Adapted from gitroomhq/postiz-docker-compose docker-compose.yaml at commit
# dd4969e5 (AGPL-3.0, https://github.com/gitroomhq/postiz-docker-compose).
# Changes from upstream, all deliberate (doc 2667 decision 5):
#   - app image pinned to a release tag, never :latest
#   - every published port bound to 127.0.0.1 (reached only through the tunnel)
#   - all secrets read from ./.env on the host (chmod 600, never committed)
#   - DISABLE_REGISTRATION is 'true' from the first boot. Postiz still lets the
#     very first account register while zero organisations exist
#     (auth.service.ts canRegister, v2.25.3), then the door shuts.
#   - NOT_SECURED, STRIP_LINKS_FROM_X_POSTS, every Stripe key and
#     POSTIZ_GENERIC_OAUTH are left OUT on purpose. Postiz tests them for
#     truthiness, so any value (even 'false') changes behaviour. Do not add them.
#   - unused provider keys, the Sentry spotlight debug service and the
#     temporal-ui service are removed
#
# Postiz app runs unmodified, so AGPL section 13 adds no duty (doc 2667 decision 6).

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.25.3 # bump per README "Updates"
    container_name: postiz
    restart: unless-stopped
    environment:
      # === Required
      MAIN_URL: 'https://${POSTIZ_HOSTNAME:?set POSTIZ_HOSTNAME in .env}'
      FRONTEND_URL: 'https://${POSTIZ_HOSTNAME}'
      NEXT_PUBLIC_BACKEND_URL: 'https://${POSTIZ_HOSTNAME}/api'
      JWT_SECRET: '${JWT_SECRET:?set JWT_SECRET in .env}'
      DATABASE_URL: 'postgresql://postiz-user:${POSTIZ_DB_PASSWORD:?set POSTIZ_DB_PASSWORD in .env}@postiz-postgres:5432/postiz-db-local'
      REDIS_URL: 'redis://postiz-redis:6379'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      TEMPORAL_ADDRESS: 'temporal:7233'
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'true'
      RUN_CRON: 'true'
      API_LIMIT: 30

      # === Storage (local volume; see README "Media" before posting images)
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'

      # === Phase 1 channels. Empty until that channel's runbook step.
      # Bluesky needs no server key: each account enters an app password in the UI.
      TELEGRAM_BOT_NAME: '${TELEGRAM_BOT_NAME:-}'
      TELEGRAM_TOKEN: '${TELEGRAM_TOKEN:-}'
      DISCORD_CLIENT_ID: '${DISCORD_CLIENT_ID:-}'
      DISCORD_CLIENT_SECRET: '${DISCORD_CLIENT_SECRET:-}'
      DISCORD_BOT_TOKEN_ID: '${DISCORD_BOT_TOKEN_ID:-}'
      NEYNAR_CLIENT_ID: '${NEYNAR_CLIENT_ID:-}'
      NEYNAR_SECRET_KEY: '${NEYNAR_SECRET_KEY:-}'
      NEYNAR_APP_FID: '${NEYNAR_APP_FID:-}'
      NEYNAR_APP_MNEMONIC: '${NEYNAR_APP_MNEMONIC:-}'

      NX_ADD_PLUGINS: false
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - '127.0.0.1:4007:5000'
    networks:
      - postiz-network
      - temporal-network
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:5000/',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_healthy

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: '${POSTIZ_DB_PASSWORD}'
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz-user -d postiz-db-local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

  # -----------------------
  # Temporal (Postiz's scheduler, required since v2.12.0)
  # -----------------------
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: '${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD in .env}'
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:7233:7233'
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    restart: on-failure
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    tty: true
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  postgres-volume:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:
  temporal-postgres-data:
  temporal-elasticsearch-data:

networks:
  postiz-network:
  temporal-network:
    driver: bridge
    name: temporal-network
